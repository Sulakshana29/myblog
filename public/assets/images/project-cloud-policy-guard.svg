<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Consolas, 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162a"/>
      <stop offset="1" stop-color="#0b0d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b6cf0"/>
      <stop offset="1" stop-color="#2fe0e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#9b6cf0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9b6cf0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Terminal window -->
  <rect x="150" y="150" width="1300" height="700" rx="22" fill="#0d0f1c" stroke="#2a2f4a" stroke-width="2"/>
  <path d="M150 172 a22 22 0 0 1 22 -22 h1256 a22 22 0 0 1 22 22 v40 h-1300 z" fill="#1a1d33"/>
  <circle cx="195" cy="181" r="9" fill="#ff5f57"/>
  <circle cx="225" cy="181" r="9" fill="#febc2e"/>
  <circle cx="255" cy="181" r="9" fill="#28c840"/>
  <text x="800" y="189" text-anchor="middle" font-size="22" fill="#6b7194">cloud-policy-guard</text>

  <g font-size="30">
    <text x="200" y="285" fill="#2fe0e0">$ <tspan fill="#d8dcef">cloud-policy-guard scan --terraform-plan plan.json</tspan></text>

    <text x="200" y="370" fill="#ff6b81" font-weight="bold">CRITICAL</text>
    <text x="400" y="370" fill="#8a90b0">LP001</text>
    <text x="530" y="370" fill="#d8dcef">Wildcard Action  "Action": "*"</text>

    <text x="200" y="425" fill="#ff6b81" font-weight="bold">CRITICAL</text>
    <text x="400" y="425" fill="#8a90b0">LP006</text>
    <text x="530" y="425" fill="#d8dcef">Broad Trust Policy  "Principal": "*"</text>

    <text x="200" y="480" fill="#ffb454" font-weight="bold">HIGH</text>
    <text x="400" y="480" fill="#8a90b0">LP004</text>
    <text x="530" y="480" fill="#d8dcef">Sensitive IAM Action  iam:PassRole</text>

    <text x="200" y="565" fill="#8a90b0">Risk score  <tspan fill="#ff6b81" font-weight="bold">27</tspan>  /  max 20</text>

    <rect x="196" y="610" width="560" height="64" rx="10" fill="#ff6b81" fill-opacity="0.12" stroke="#ff6b81" stroke-opacity="0.5"/>
    <text x="222" y="653" fill="#ff6b81" font-weight="bold">✖ FAIL · pipeline blocked (exit 1)</text>

    <text x="200" y="770" fill="#2fe0e0">$ <tspan fill="#d8dcef">_</tspan></text>
  </g>

  <rect x="150" y="900" width="420" height="6" rx="3" fill="url(#accent)"/>
  <text x="600" y="912" font-size="26" fill="#8a90b0" font-family="Inter, 'Segoe UI', sans-serif">IAM least-privilege gate for Terraform</text>
</svg>
